<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Desk Buddy AI - Burt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://js.puter.com/v2/"></script>
<style>
  :root {
    --eye: #9be7e0;
    --glow: #3fb8b0;
    --bg: #000000;
    --font-pixel: 'Press Start 2P', monospace, sans-serif;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    height: 100%;
    width: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font-pixel);
    color: #fff;
    transition: background-color 0.3s ease;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 999;
    pointer-events: none;
    opacity: 0.6;
  }

  #matrix-canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    display: none;
  }
  body.bg-matrix #matrix-canvas {
    display: block;
  }

  #viewport-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* CANVAS AVATAR STAGE */
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  #avatar-canvas {
    width: 65vmin;
    height: 65vmin;
    filter: drop-shadow(0 0 25px var(--glow));
    transition: transform 0.3s ease;
  }

  #sub {
    position: absolute;
    left: 50%;
    bottom: 18vmin;
    transform: translateX(-50%);
    width: 75vmin;
    text-align: center;
    color: var(--eye);
    font-size: 2vmin;
    line-height: 1.5;
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 0 8px var(--glow);
    background: rgba(0, 0, 0, 0.85);
    padding: 1.5vmin 2.5vmin;
    border: 1px solid var(--eye);
    border-radius: 4px;
    box-shadow: 0 0 15px var(--glow);
  }
  #sub.on { opacity: 1; }

  #chat-bar {
    position: absolute;
    bottom: 10vmin;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1vmin;
    z-index: 25;
    width: 65vmin;
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid var(--eye);
    padding: 0.8vmin;
    border-radius: 4px;
    box-shadow: 0 0 15px var(--glow);
  }
  #chat-input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-family: var(--font-pixel);
    font-size: 1.6vmin;
    outline: none;
    padding: 0.5vmin 1vmin;
    user-select: text;
  }
  #chat-send-btn {
    background: var(--eye);
    border: none;
    color: #000;
    font-family: var(--font-pixel);
    font-size: 1.4vmin;
    padding: 0.8vmin 1.5vmin;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  #chat-send-btn:hover {
    box-shadow: 0 0 10px var(--glow);
    background: #fff;
  }

  #cyber-deck-bar {
    position: absolute;
    bottom: 2.5vmin;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 1.5vmin;
    z-index: 25;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid var(--eye);
    padding: 1vmin 2vmin;
    border-radius: 4px;
    box-shadow: 0 0 15px var(--glow);
  }
  .deck-btn {
    background: #000;
    border: 1px solid var(--eye);
    color: var(--eye);
    font-family: var(--font-pixel);
    font-size: 1.6vmin;
    padding: 1vmin 1.2vmin;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .deck-btn:hover {
    background: var(--eye);
    color: #000;
    box-shadow: 0 0 10px var(--glow);
  }

  #gear-btn {
    position: absolute;
    top: 3vmin;
    left: 3vmin;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid var(--eye);
    color: var(--eye);
    width: 6vmin;
    height: 6vmin;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5vmin;
    cursor: pointer;
    z-index: 25;
    box-shadow: 0 0 10px var(--glow);
  }

  #config-modal {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4vmin;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  #config-modal.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    width: 85vmin;
    max-width: 450px;
    border: 2px solid var(--eye);
    box-shadow: 0 0 20px var(--glow);
    padding: 3vmin;
    background: #000;
    display: flex;
    flex-direction: column;
    gap: 2vmin;
    text-align: center;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-box h2 { color: var(--eye); font-size: 2.5vmin; }
  .modal-box p { color: #88a; font-size: 1.5vmin; }
  .modal-box input, .modal-box select {
    width: 100%;
    padding: 1.5vmin;
    background: #000;
    border: 1px solid var(--eye);
    color: #fff;
    font-family: var(--font-pixel);
    font-size: 1.6vmin;
    outline: none;
    text-align: center;
  }
  .modal-actions { display: flex; gap: 2vmin; justify-content: center; margin-top: 1vmin; }
  .btn { padding: 1.5vmin 3vmin; border: 1px solid var(--eye); font-family: var(--font-pixel); font-size: 1.8vmin; cursor: pointer; }
  .btn-primary { background: var(--eye); color: #000; }
  .btn-secondary { background: #000; color: var(--eye); }
</style>
</head>
<body class="bg-black">
<canvas id="matrix-canvas"></canvas>

<div id="viewport-wrapper">
  <button id="gear-btn" aria-label="Settings">⚙</button>

  <div id="stage">
    <canvas id="avatar-canvas" width="400" height="400"></canvas>
  </div>

  <div id="sub"></div>

  <div id="chat-bar">
    <input type="text" id="chat-input" placeholder="TYPE MESSAGE TO BURT..." autocomplete="off">
    <button id="chat-send-btn">SEND</button>
  </div>

  <div id="cyber-deck-bar">
    <button class="deck-btn" id="btn-mic">🎤 MIC</button>
  </div>

  <div id="config-modal">
    <div class="modal-box">
      <h2>BURT_CONFIG</h2>
      <p>AI Provider:</p>
      <select id="provider-select">
        <option value="gemini">Google Gemini</option>
        <option value="grok">xAI Grok</option>
        <option value="openrouter">OpenRouter</option>
      </select>

      <div id="gemini-key-group">
        <p>Gemini API Key:</p>
        <input type="password" id="api-key-input" placeholder="AIzaSy...">
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancel-config-btn">CANCEL</button>
        <button class="btn btn-primary" id="save-config-btn">SAVE</button>
      </div>
    </div>
  </div>
</div>

<script>
let GEMINI_API_KEY = localStorage.getItem("desk_buddy_gemini_key") || "";
let AI_PROVIDER = localStorage.getItem("desk_buddy_provider") || "gemini";

/* DYNAMIC CANVAS AVATAR ENGINE */
const cvs = document.getElementById("avatar-canvas");
const ctx = cvs.getContext("2d");

let currentEmotion = "idle";
let talkMouthOpen = 0;
let eyeBlink = 0;

function drawAvatar() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--eye').trim() || "#9be7e0";

  // Ear Left
  ctx.fillStyle = "#333338";
  ctx.beginPath();
  ctx.ellipse(120, 100, 45, 80, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = themeColor;
  ctx.beginPath();
  ctx.ellipse(125, 105, 25, 50, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Ear Right
  ctx.fillStyle = "#333338";
  ctx.beginPath();
  ctx.ellipse(280, 100, 45, 80, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fbc02d";
  ctx.beginPath();
  ctx.ellipse(275, 105, 25, 50, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Main Head
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(200, 220, 110, 0, Math.PI * 2);
  ctx.fill();

  // Head Hood / Dark Fur Outer
  ctx.fillStyle = "#333338";
  ctx.beginPath();
  ctx.arc(200, 210, 112, Math.PI * 0.85, Math.PI * 2.15);
  ctx.fill();

  // Cheeks
  ctx.fillStyle = "#ffb300";
  ctx.beginPath();
  ctx.arc(130, 240, 22, 0, Math.PI * 2);
  ctx.arc(270, 240, 22, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  const blinkH = Math.max(0.1, 1 - eyeBlink);
  ctx.fillStyle = "#111111";
  
  // Left Eye
  ctx.beginPath();
  ctx.ellipse(155, 205, 18, 24 * blinkH, 0, 0, Math.PI * 2);
  ctx.fill();
  // Right Eye
  ctx.beginPath();
  ctx.ellipse(245, 205, 18, 24 * blinkH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eye Highlights
  if (blinkH > 0.4) {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(150, 198, 6, 0, Math.PI * 2);
    ctx.arc(240, 198, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // Nose
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.ellipse(200, 212, 4, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // Animated Mouth
  ctx.fillStyle = "#d32f2f";
  ctx.beginPath();
  let mouthH = 12;
  if (currentEmotion === "happy" || currentEmotion === "excited") mouthH = 22;
  if (currentEmotion === "thinking") mouthH = 5;
  
  if (talkMouthOpen > 0) mouthH = 15 + Math.sin(talkMouthOpen) * 12;

  ctx.ellipse(200, 240, 16, mouthH, 0, 0, Math.PI);
  ctx.fill();

  requestAnimationFrame(drawAvatar);
}

// Eye Blinking Loop
setInterval(() => {
  if (Math.random() > 0.6) {
    eyeBlink = 1;
    setTimeout(() => { eyeBlink = 0; }, 150);
  }
}, 3000);

// Talking Loop
setInterval(() => {
  if (currentEmotion === "talking") {
    talkMouthOpen += 0.4;
  } else {
    talkMouthOpen = 0;
  }
}, 50);

drawAvatar();

function setFace(emotion) {
  currentEmotion = emotion;
}

/* API CHAT & VOICE INTERACTION */
const sub = document.getElementById("sub");

function sendTextMessage() {
  const input = document.getElementById("chat-input");
  const txt = input.value.trim();
  if (!txt) return;
  input.value = "";
  handleInput(txt);
}

document.getElementById("chat-send-btn").addEventListener("click", sendTextMessage);
document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendTextMessage();
});

async function handleInput(text) {
  setFace("thinking");
  sub.textContent = "THINKING...";
  sub.classList.add("on");

  let reply = "Hello! I am Burt, your desktop AI buddy.";
  if (GEMINI_API_KEY) {
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: `You are Burt, a friendly British desk buddy AI. Answer concisely:\nUser: ${text}` }] }] })
      });
      const data = await res.json();
      if (data.candidates && data.candidates[0].content.parts[0].text) {
        reply = data.candidates[0].content.parts[0].text;
      }
    } catch(e) {}
  }

  speakResponse(reply);
}

function speakResponse(text) {
  setFace("talking");
  sub.textContent = text;

  if (window.puter && puter.ai && puter.ai.txt2speech) {
    puter.ai.txt2speech(text, "en-GB").then(audio => {
      audio.play();
      audio.onended = () => {
        setFace("idle");
        sub.classList.remove("on");
      };
    }).catch(() => fallbackSpeech(text));
  } else {
    fallbackSpeech(text);
  }
}

function fallbackSpeech(text) {
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-GB";
    u.onend = () => { setFace("idle"); sub.classList.remove("on"); };
    speechSynthesis.speak(u);
  } else {
    setTimeout(() => { setFace("idle"); sub.classList.remove("on"); }, 4000);
  }
}

/* CONFIG MODAL */
document.getElementById("gear-btn").onclick = () => {
  document.getElementById("api-key-input").value = GEMINI_API_KEY;
  document.getElementById("config-modal").classList.add("open");
};
document.getElementById("cancel-config-btn").onclick = () => {
  document.getElementById("config-modal").classList.remove("open");
};
document.getElementById("save-config-btn").onclick = () => {
  GEMINI_API_KEY = document.getElementById("api-key-input").value.trim();
  localStorage.setItem("desk_buddy_gemini_key", GEMINI_API_KEY);
  document.getElementById("config-modal").classList.remove("open");
};
</script>
</body>
</html>
